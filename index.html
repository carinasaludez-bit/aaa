<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@400;700&display=swap');

body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffc1cc, #ffe4e1);
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 4em;
    color: #ff4b6e;
    text-align: center;
    margin-bottom: 20px;
    animation: fadeIn 2s ease-in;
}

p {
    font-size: 1.5em;
    color: #333;
    text-align: center;
    margin-bottom: 40px;
    animation: fadeIn 3s ease-in;
}

button {
    padding: 15px 30px;
    margin: 10px;
    font-size: 1.2em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
    color: #fff;
    background: #ff4b6e;
    box-shadow: 0 4px 15px rgba(255,75,110,0.4);
}

button:hover {
    transform: scale(1.1);
    background: #ff2d55;
}

.hearts {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4b6e;
    transform: rotate(45deg);
    animation: float 5s infinite;
}

.hearts::before,
.hearts::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4b6e;
    border-radius: 50%;
}

.hearts::before { top: -10px; left: 0; }
.hearts::after { top: 0; left: -10px; }

@keyframes float {
    0% { transform: translateY(0) rotate(45deg); opacity: 1; }
    100% { transform: translateY(-800px) rotate(45deg); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
</head>
<body>

<h1>Emanuele ❤️</h1>
<p>Will you be my Valentine?</p>
<div>
    <button onclick="sayYes()">YES</button>
    <button onclick="sayNo()">NO</button>
</div>

<audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
function sayYes() {
    document.body.innerHTML = '<h1>She Said YES! 💖</h1>';
    explodeHearts();
}

function sayNo() {
    document.body.innerHTML = '<h1>It\'s OK! 💌</h1>';
    explodeHearts();
}

function explodeHearts() {
    for(let i=0; i<50; i++){
        let heart = document.createElement('div');
        heart.classList.add('hearts');
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.animationDuration = (Math.random()*3 + 2) + 's';
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    }
}
</script>

</body>
</html>
